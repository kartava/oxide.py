name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m venv "$RUNNER_TEMP/package"
      - run: '"$RUNNER_TEMP/package/bin/python" -m pip install .'
      - run: >-
          "$RUNNER_TEMP/package/bin/python" -c "import importlib.resources;
          assert importlib.resources.files('oxide').joinpath('py.typed').is_file()"
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -e . --group dev
      - run: .venv/bin/python -m pytest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -e . --group dev
      - run: .venv/bin/python -m pre_commit run --all-files
      - run: .venv/bin/python -m mypy
      - run: .venv/bin/python -m pyright
      - run: .venv/bin/python -m ty check
      - run: .venv/bin/python -m pyrefly check
      - run: .venv/bin/python -m coverage run -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true

  coverage:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage
      - uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f  # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
