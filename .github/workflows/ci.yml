name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m venv "$RUNNER_TEMP/package"
      - run: '"$RUNNER_TEMP/package/bin/python" -m pip install .'
      - run: >-
          "$RUNNER_TEMP/package/bin/python" -c "import importlib.resources;
          assert importlib.resources.files('oxide').joinpath('py.typed').is_file()"
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -e . --group dev
      - run: .venv/bin/python -m pytest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -e . --group dev
      - run: .venv/bin/python -m pre_commit run --all-files
      - run: .venv/bin/python -m mypy
      - run: .venv/bin/python -m pyright
      - run: .venv/bin/python -m ty check
      - run: .venv/bin/python -m pyrefly check
