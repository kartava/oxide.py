repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-format
        args: [--check]
      - id: ruff-check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: check-trailing-whitespace
        name: check for trailing whitespace
        entry: '[ \t]+$'
        language: pygrep
        types: [text]
      - id: check-end-of-file
        name: check for one newline at end of file
        entry: '(?:[^\n]|\n\n)\Z'
        language: pygrep
        args: [--multiline]
        types: [text]
