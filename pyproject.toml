[project]
name = "oxide.py"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oxide"]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "mypy==2.4.1",
    "pyright==1.1.414",
    "ty==0.0.95",
    "pyrefly==1.4.0",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.pyrefly]
python-version = "3.11"
project-includes = ["src", "tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "RUF",
    "ANN", "PGH", "PT", "TID", "PLC0105",
]
ignore = ["D1", "ANN401"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
